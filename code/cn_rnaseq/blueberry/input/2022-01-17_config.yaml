#optional email config to send on run start/complete/error
email:
  subject: 2022-01-18_Rai1KO_mRNA-seq
  to: siwase@umich.edu 

# Either absolute dirs or relative to where you launch snakemake
dirs:
  input: /nfs/dataden/umms-siwase/SHIGEKI/rai1ko_hesc/code/blueberry/input/fastq
  output: /nfs/dataden/umms-siwase/SHIGEKI/rai1ko_hesc/code/blueberry/output
  reference: /nfs/dataden/umms-siwase/GENOME/HG38 # the reference folder that contains genome fasta file and gtf file

# These files/dirs assumed to be inside reference dir specified above
genome_reference:
  fasta: hg38.fa
  gtf: hg38.ncbiRefSeq.gtf
  star:
    # star genome will be built if it doesn't exist
    genome_dir: rsem_star_genome
    # sjdbOverhang is optional; will default to read_length - 1
    #sjdbOverhang: 149

sequencing_parameters:
  read_length: 150
  #strand_flag
  # '--rf'    Assumes a stranded library fr-firststrand, e.g. Trueseq
  # '--fr'    Assumes a stranded library fr-secondstrand
  # ''        Leave blank if unstranded
  strand_flag: '--rf'

